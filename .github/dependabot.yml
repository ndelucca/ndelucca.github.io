version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem instead of one per package, so a routine bump is a
      # single review rather than fifteen.
      webpack:
        patterns:
          - webpack
          - webpack-*
          - '*-loader'
          - '*-webpack-plugin'
      tooling:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - prettier
          - typescript
          - jest
          - '@types/jest'
          - ts-jest
          - jest-environment-jsdom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
